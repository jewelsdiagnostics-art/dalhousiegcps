<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital MS Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Electronic Medical Records</p>
      <h1>Hospital Management System</h1>
    </div>
    <div id="authState" class="auth-state">Not signed in</div>
  </header>

  <main class="layout">
    <section class="panel auth-panel">
      <h2>Authentication</h2>
      <form id="signupForm" class="form-grid">
        <h3>Sign Up</h3>
        <input id="signupName" placeholder="Full name" required />
        <input id="signupEmail" type="email" placeholder="Email" required />
        <input id="signupPassword" type="password" placeholder="Password" required />
        <select id="signupRole" required>
          <option value="PATIENT">PATIENT</option>
          <option value="DOCTOR">DOCTOR</option>
          <option value="STAFF">STAFF</option>
          <option value="NURSE">NURSE</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <button type="submit">Create account</button>
      </form>

      <form id="loginForm" class="form-grid">
        <h3>Sign In</h3>
        <input id="loginEmail" type="email" placeholder="Email" required />
        <input id="loginPassword" type="password" placeholder="Password" required />
        <button type="submit">Sign in</button>
      </form>

      <button id="logoutBtn" class="danger">Sign out</button>
    </section>

    <section class="panel module-panel">
      <nav class="tabs" id="tabs"></nav>
      <div id="moduleContent"></div>
    </section>
  </main>

  <section class="panel logs-panel">
    <h2>Activity Log</h2>
    <pre id="logs"></pre>
  </section>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
